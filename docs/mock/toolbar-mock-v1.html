<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メモおこし — ツールバー配置 比較</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f1eb; --desk:#eeebe3; --surface:#ffffff; --ink:#2b2a25; --sub:#7b766c;
  --line:#e3dfd6; --faint:#faf9f5;
  --accent:#33566b; --accent-deep:#274456;
  --t1:#8fae9d; --t2:#93a9c0; --t3:#cbb478; --t4:#c39a8a; --t5:#a89bb5; --t6:#9db3ae;
  --head:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Hiragino Sans","Yu Gothic UI",Meiryo,system-ui,sans-serif;background:#dedad0;color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:40px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
.label{font-family:var(--head);font-size:.8rem;letter-spacing:.14em;color:#5f5a50;padding:22px 20px 8px}
.label small{display:block;font-family:inherit;letter-spacing:0;font-size:.74rem;color:#8b8578;margin-top:3px;font-weight:400}
.frame{background:var(--bg);margin:0 16px 20px;border-radius:12px;overflow:hidden;box-shadow:0 2px 10px rgba(43,42,37,.10)}

/* ---------- header ---------- */
header{background:var(--surface);border-bottom:1px solid var(--line)}
.h-in{display:flex;align-items:center;gap:16px;padding:8px 14px}
.brand{font-family:var(--head);font-weight:700;font-size:.95rem;letter-spacing:.06em;display:flex;align-items:center;gap:7px;flex:0 0 auto}
.brand::before{content:"";width:7px;height:19px;border-radius:3px;background:linear-gradient(180deg,var(--t1),var(--t2))}
.steps{display:flex;align-items:center;gap:2px}
.steps .s{display:flex;align-items:center;gap:6px;padding:4px 11px 4px 6px;border-radius:99px;font-size:.75rem;color:#a9a396}
.steps .s .n{width:18px;height:18px;border-radius:50%;background:#ddd8cc;color:#fff;font-family:var(--head);font-size:.6rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.steps .s.done{color:var(--accent);cursor:pointer}
.steps .s.done .n{background:var(--t1)}
.steps .s.cur{background:var(--accent);color:#fff;font-weight:700}
.steps .s.cur .n{background:rgba(255,255,255,.28)}
.steps i{font-style:normal;color:#cfc9bc;font-size:.68rem}
.h-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.dict{background:var(--faint);border:1px solid var(--line);border-radius:9px;padding:6px 13px 6px 10px;font-size:.78rem;color:var(--sub);display:flex;align-items:center;gap:7px}
.dict::before{content:"";width:4px;height:14px;border-radius:2px;background:var(--t3)}

/* ---------- 取り込み: 下部の操作帯 ---------- */
.desk{height:250px;background:var(--desk);position:relative;overflow:hidden}
.desk::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.55;
  background-image:repeating-linear-gradient(92deg,rgba(150,138,118,.028) 0 2px,transparent 2px 7px,rgba(150,138,118,.018) 7px 8px,transparent 8px 19px)}
.sheets{position:relative;z-index:2;display:flex;gap:18px;padding:22px}
.sh{width:130px;height:180px;border-radius:3px;background:#fff;box-shadow:0 2px 5px rgba(43,42,37,.10),0 8px 16px rgba(43,42,37,.05);position:relative;flex:0 0 auto}
.sh:nth-child(odd){transform:rotate(-.7deg)} .sh:nth-child(even){transform:rotate(.6deg)}
.sh::before{content:"";position:absolute;left:-1px;top:12px;width:5px;height:26px;border-radius:0 3px 3px 0;background:var(--c,var(--t1))}
.sh .scr{padding:16px 12px}
.sh .scr div{height:2px;background:#ded9cd;border-radius:2px;margin-bottom:9px}
.sh .scr div:nth-child(2){width:76%} .sh .scr div:nth-child(4){width:60%} .sh .scr div:nth-child(5){width:83%}
.plus-slot{width:130px;height:180px;border-radius:3px;border:1.5px dashed #c8c1b2;background:rgba(255,255,255,.5);display:flex;align-items:center;justify-content:center;color:#a49d8e;font-size:1.6rem;font-weight:300;flex:0 0 auto;transform:rotate(.5deg)}
.ghost{width:130px;height:180px;border-radius:3px;border:1px dashed rgba(180,172,156,.38);background:rgba(255,255,255,.18);flex:0 0 auto}

.actionbar{
  background:var(--surface);border-top:1px solid var(--line);
  display:flex;align-items:center;gap:14px;padding:11px 18px;
  box-shadow:0 -3px 14px rgba(43,42,37,.05);
}
.count{font-size:.82rem;color:var(--sub)}
.count b{font-family:var(--head);color:var(--ink);font-size:1rem;margin-right:2px}
.go{
  margin-left:auto;background:var(--accent);color:#fff;border-radius:10px;
  padding:11px 30px 11px 24px;font-family:var(--head);font-size:.92rem;font-weight:700;letter-spacing:.08em;
  display:flex;align-items:center;gap:10px;position:relative;
  box-shadow:0 2px 8px rgba(51,86,107,.25);
  animation:pulse 2.6s ease-out infinite;
}
@keyframes pulse{0%{box-shadow:0 2px 8px rgba(51,86,107,.25),0 0 0 0 rgba(51,86,107,.30)}70%{box-shadow:0 2px 8px rgba(51,86,107,.25),0 0 0 11px rgba(51,86,107,0)}100%{box-shadow:0 2px 8px rgba(51,86,107,.25),0 0 0 0 rgba(51,86,107,0)}}
.go::before{content:"";width:4px;height:17px;border-radius:2px;background:var(--t1)}
.go:hover{background:var(--accent-deep)}
.go .ar{font-size:.9rem;opacity:.8}

/* ---------- 伏せる: 左の縦帯 ---------- */
.editor{display:flex;height:330px}
.ltool{
  width:62px;flex:0 0 auto;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 0;
}
.ltool .grp{display:flex;flex-direction:column;gap:5px;align-items:center}
.ltool .hr{width:30px;height:1px;background:var(--line);margin:6px 0}
.tl{
  width:44px;height:42px;border-radius:10px;background:var(--faint);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--sub);
}
.tl:hover{background:#eceae3}
.tl.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tl.on .dot{background:#fff}
.tl .dot{width:var(--d,9px);height:var(--d,9px);border-radius:50%;background:#5d594f}
.tl .er{width:15px;height:11px;border:2px solid currentColor;border-radius:3px;background:repeating-linear-gradient(45deg,transparent,transparent 3px,currentColor 3px,currentColor 4px)}
.tl .lb{font-size:.53rem;font-family:var(--head);letter-spacing:.02em}
.tl[disabled]{opacity:.32}
.ltool .spacer{flex:1}
.ltool .fin{
  width:46px;height:46px;border-radius:12px;background:var(--accent);color:#fff;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  font-family:var(--head);font-size:.56rem;font-weight:700;letter-spacing:.04em;
  box-shadow:0 2px 8px rgba(51,86,107,.28);animation:pulse 2.6s ease-out infinite;
}
.ltool .fin span:first-child{font-size:.95rem;line-height:1}
.canvas{flex:1;background:#5d594f;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.paper{width:210px;height:290px;background:#efe9dc;box-shadow:0 4px 20px rgba(0,0,0,.3);padding:20px 16px;transform:rotate(-.4deg)}
.paper div{height:3px;background:#3d3a31;opacity:.55;border-radius:2px;margin-bottom:13px}
.paper div:nth-child(2){width:72%} .paper div:nth-child(4){width:58%} .paper div:nth-child(5){width:80%} .paper div:nth-child(7){width:64%}
.paper .blk{height:15px;background:#26241f;opacity:1;width:52%;border-radius:2px}
.zoombadge{position:absolute;bottom:10px;right:12px;background:rgba(43,42,37,.7);color:#fff;font-size:.68rem;padding:3px 10px;border-radius:99px}

/* ---------- ヘルプ入口 ---------- */
.helprow{display:flex;gap:26px;padding:20px 22px;align-items:center;flex-wrap:wrap;background:var(--surface)}
.hopt{display:flex;flex-direction:column;align-items:center;gap:7px}
.hopt .cap{font-size:.7rem;color:#8b8578;font-family:var(--head);letter-spacing:.06em}
.h-btn{
  height:32px;border:1px solid var(--line);background:var(--faint);border-radius:9px;color:var(--sub);
  display:flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;font-size:.78rem;
}
.h-btn:hover{border-color:var(--accent);color:var(--accent)}
.h-btn.sq{width:32px;padding:0}
.bk{width:15px;height:16px;position:relative;flex:0 0 auto}
.bk i{position:absolute;inset:0;border:1.5px solid currentColor;border-radius:2px 3px 3px 2px}
.bk b{position:absolute;left:-2px;top:3px;width:4px;height:7px;border-radius:0 2px 2px 0;background:var(--t3)}
</style>
</head>
<body>

<!-- ============ 1. 取り込み: 下部の操作帯 ============ -->
<div class="label">1. 取り込み画面 — 下部に操作の帯<small>紙を置いた視線がそのまま下に落ちる位置。枚数も一緒に見える。右上のボタンは外します。</small></div>
<div class="frame">
  <header><div class="h-in">
    <div class="brand">メモおこし</div>
    <div class="steps">
      <div class="s cur"><span class="n">1</span>取り込み</div><i>›</i>
      <div class="s"><span class="n">2</span>伏せる</div><i>›</i>
      <div class="s"><span class="n">3</span>変換</div><i>›</i>
      <div class="s"><span class="n">4</span>確認</div><i>›</i>
      <div class="s"><span class="n">5</span>出力</div>
    </div>
    <div class="h-right">
      <button class="h-btn"><span class="bk"><i></i><b></b></span>使い方</button>
      <button class="dict">辞書</button>
    </div>
  </div></header>
  <div class="desk"><div class="sheets">
    <div class="sh" style="--c:var(--t1)"><div class="scr"><div></div><div></div><div></div><div></div><div></div></div></div>
    <div class="sh" style="--c:var(--t2)"><div class="scr"><div></div><div></div><div></div><div></div><div></div></div></div>
    <div class="plus-slot">＋</div>
    <div class="ghost"></div>
  </div></div>
  <div class="actionbar">
    <span class="count"><b>2</b>枚</span>
    <button class="go">次へ<span class="ar">›</span></button>
  </div>
</div>

<!-- ============ 2. 伏せる: 左の縦帯 ============ -->
<div class="label">2. 伏せる画面 — 左に道具を固める<small>ペン・消しゴム・拡大移動をひとつの帯に。次へ進むボタンは同じ帯の一番下。</small></div>
<div class="frame">
  <header><div class="h-in">
    <div class="brand">メモおこし</div>
    <div class="steps">
      <div class="s done"><span class="n">1</span>取り込み</div><i>›</i>
      <div class="s cur"><span class="n">2</span>伏せる</div><i>›</i>
      <div class="s"><span class="n">3</span>変換</div><i>›</i>
      <div class="s"><span class="n">4</span>確認</div><i>›</i>
      <div class="s"><span class="n">5</span>出力</div>
    </div>
    <div class="h-right">
      <button class="h-btn"><span class="bk"><i></i><b></b></span>使い方</button>
      <button class="dict">辞書</button>
    </div>
  </div></header>
  <div class="editor">
    <div class="ltool">
      <div class="grp">
        <button class="tl on"><span class="dot" style="--d:6px"></span><span class="lb">細</span></button>
        <button class="tl"><span class="dot" style="--d:9px"></span><span class="lb">中</span></button>
        <button class="tl"><span class="dot" style="--d:13px"></span><span class="lb">太</span></button>
        <button class="tl"><span class="er"></span><span class="lb">消す</span></button>
      </div>
      <div class="hr"></div>
      <div class="grp">
        <button class="tl"><span style="font-size:1rem;line-height:1">↶</span><span class="lb">戻す</span></button>
        <button class="tl"><span style="font-size:.9rem;line-height:1">✕</span><span class="lb">全消し</span></button>
      </div>
      <div class="hr"></div>
      <div class="grp">
        <button class="tl"><span style="font-size:1.1rem;line-height:1">＋</span></button>
        <button class="tl"><span style="font-size:1.1rem;line-height:1">−</span></button>
        <button class="tl"><span class="lb" style="font-size:.62rem">全体</span></button>
        <button class="tl"><span style="font-size:.9rem;line-height:1">✥</span><span class="lb">移動</span></button>
      </div>
      <div class="spacer"></div>
      <button class="fin"><span>›</span><span>次へ</span></button>
    </div>
    <div class="canvas">
      <div class="paper">
        <div class="blk"></div><div></div><div></div><div></div><div></div><div></div><div></div>
      </div>
      <div class="zoombadge">86%</div>
    </div>
  </div>
</div>

<!-- ============ 3. ヘルプ入口の候補 ============ -->
<div class="label">3. 使い方の入口 — 候補<small>いま実装されているのは A です。</small></div>
<div class="frame"><div class="helprow">
  <div class="hopt"><button class="h-btn sq">?</button><span class="cap">A 現行</span></div>
  <div class="hopt"><button class="h-btn sq"><span class="bk"><i></i><b></b></span></button><span class="cap">B 冊子だけ</span></div>
  <div class="hopt"><button class="h-btn"><span class="bk"><i></i><b></b></span>使い方</button><span class="cap">C 冊子＋文字</span></div>
  <div class="hopt"><button class="h-btn">使い方</button><span class="cap">D 文字だけ</span></div>
</div></div>

</body>
</html>
